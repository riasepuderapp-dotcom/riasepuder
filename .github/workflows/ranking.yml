# Ranking geral do Ria Se Puder
# Uma vez por dia busca no serviço (Google Apps Script) a soma das estrelas e favoritas de todos os aparelhos
# e publica em conteudo/ranking.json, que o app lê na tela "Minhas favoritas" (aba Top geral).
#
# Para ligar: Settings > Secrets and variables > Actions > New repository secret
#   Nome: RANKING_URL   Valor: https://script.google.com/macros/s/.../exec?acao=ranking
name: Ranking geral

on:
  schedule:
    - cron: "17 9 * * *"     # todo dia, 06:17 em Salvador
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar o ranking do serviço
        env:
          RANKING_URL: ${{ secrets.RANKING_URL }}
        run: |
          if [ -z "$RANKING_URL" ]; then echo "Segredo RANKING_URL ainda não configurado: nada a fazer."; exit 0; fi
          curl -fsSL --max-time 120 "$RANKING_URL" -o /tmp/ranking.json
          jq -e '.piadas | type == "array"' /tmp/ranking.json > /dev/null
          jq '.' /tmp/ranking.json > conteudo/ranking.json
      - name: Publicar se mudou
        run: |
          git config user.name "Ria Se Puder (ranking)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conteudo/ranking.json
          if git diff --cached --quiet; then echo "Ranking sem mudanças."; exit 0; fi
          git commit -m "Ranking geral: atualização diária"
          git push
